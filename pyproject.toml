[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sca"
version = "0.1.0"
description = "Structured Crystal Analyser: internal tools for evaluating crystal structures."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Structured Crystal Analyser contributors" }
]
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.0",
  "pymatgen>=2024.0",
  "rich>=13.0",
  "tqdm>=4.60",
  "typer>=0.12"
]

[project.optional-dependencies]
alignn = [
  "alignn>=2024.0"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
sca = "sca.cli:app"

[tool.setuptools.packages.find]
include = ["sca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
